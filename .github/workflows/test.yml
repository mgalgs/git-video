name: Tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    # videobuilder needs Pango 1.56 or newer: Debian 13, not the runner's Ubuntu.
    container: debian:trixie
    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git ffmpeg \
            python3 python3-venv python3-gi python3-gi-cairo python3-cairo python3-pil python3-yaml \
            gir1.2-pango-1.0 fonts-dejavu-core fonts-noto-core

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # history tests skip on a shallow clone

      - name: Install git-video
        run: |
          python3 -m venv --system-site-packages /opt/venv
          /opt/venv/bin/pip install .

      - name: Run the tests
        env:
          # the full tolerance matrix takes minutes: run it on tags only
          GIT_VIDEO_SLOW_TESTS: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '' }}
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          # checkout's own safe.directory entry is gone by now, and the
          # container's root does not own the workspace
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          /opt/venv/bin/python -m unittest
