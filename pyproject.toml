[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git-video"
version = "0.1.0"
description = "Render an MP4 walk-through of a git change set"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "videobuilder @ git+https://github.com/mgalgs/videobuilder@v0.1.114",
    "pygments>=2.17",
]

[project.scripts]
git-video = "git_video.cli:main"

[tool.setuptools.packages.find]
include = ["git_video*"]
